name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m py_compile codexfix.py scripts/scan_sensitive.py

      # Guards against committing a real gateway address, home path or API key.
      - name: Sensitive-value scan
        run: python scripts/scan_sensitive.py .

      - name: Unit tests
        run: python -m unittest discover -s tests -v
